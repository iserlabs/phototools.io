name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run type-check
      - run: node scripts/check-translations.mjs
      - run: node scripts/check-guide-translations.mjs
      - run: npm test
      - run: npm run build

      # Integration tests (Playwright)
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test

      # Also on success: a test that failed and then passed on retry ("flaky")
      # leaves the job green, and its first-failure trace is the only evidence.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
