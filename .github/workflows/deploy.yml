name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Integration tests (Playwright)
      - run: npx playwright install --with-deps chromium firefox
      # TEMPORARY diagnostic branch, never merged.
      - run: npx playwright test src/e2e/_diag/compare-two.spec.ts --project=firefox --repeat-each=150 --retries=0 --trace=retain-on-failure --reporter=line

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-test-results
          path: test-results/
          retention-days: 7
